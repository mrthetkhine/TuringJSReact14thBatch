<html>
    
    <script>
        
        let sym= Symbol('some_name');
        let parent = {
            name : "Jhon",
            age : 35,
            [sym]:"some_value"
        }
        let obj = Object.create(parent);
        obj.address = "Some";
        for(let prop in obj)
        {
            if(obj.hasOwnProperty(prop))
            {
                console.log('Prop ',prop ,' own property ');
            }
            console.log('Prop ',prop, ' value ',obj[prop]);
        }
        console.log('keys ',Object.keys(parent));
        console.log('getOwnPropertyNames ',Object.getOwnPropertyNames(parent));
        console.log('getOwnPropertySymbols ',Object.getOwnPropertySymbols(parent));
    </script>
</html>
