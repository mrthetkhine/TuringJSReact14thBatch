<html>
    <script>
        let obj = {
            name : "Jhon",
            age : 35,
            name1:undefined,
        };
        console.log('obj ',obj);
        console.log('name in obj ','name' in obj);
        console.log('name1 in obj ','name1' in obj);
        console.log('age in obj ','age' in obj);
        console.log('toString in obj ','toString' in obj);

        let date = new Date();
        console.log('date instanceof Date ',date instanceof Date);
        console.log('obj instanceof Date ',obj instanceof Date);
        console.log('date instanceof Object ',date instanceof Object);
        console.log('obj instanceof Date ',date instanceof Object);
    </script>
</html>
