
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        let count = 1;
        count ++;
        console.log('count ',count);

        let MayBe = (value)=>({
            valueOf:()=>value,
            isEmpty()
            {
                return value === null || value === undefined;
            },
            map(fn)
            {
                return this.isEmpty()?MayBe.of(null):MayBe.of(fn(value));
            },
            orElse(defaultValue)
            {
                return this.isEmpty()?MayBe.of(defaultValue):this;
            }

        })
        MayBe.of = MayBe;
        
        function appendHi(str)
        {
            return str + ' Hi';
        }
        function toUpper(str)
        {
            return str.toUpperCase();
        }
        let data = MayBe.of(null)
                        .map(toUpper)
                        .map(appendHi)
                        .orElse('Empty string');
        console.log('data ',data.valueOf());
       
    </script>    
</html>
