<html>
    <script>
        
        let a = 10;
        //variable = literal;
        //10 = a;
        a ++;
        console.log('a ',a);

        let b = a + 2;
        console.log('b ',b);

        //operator difference->prcedence
        //same precedence-> associativity
        let result = 3 +'1'+ 2 * 3;
        console.log('result ',result);

        let str = '12';
        console.log('+str ',+str);

        a = 10;
        b = 5;
        let c = 2;
        result = a - (b -c);

        console.log('result ',result);

        result = 2 ** 3 ** 1;
        console.log('result ',result);
    </script>
</html>
