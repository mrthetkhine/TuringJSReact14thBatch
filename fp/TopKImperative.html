
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        let nums = [1,1,1,2,2,3,1,3,3,], k = 2;
        //1,3
        /*
        * count 
        sort by frequence
        take top k
         */
        /*
            {
            '1':4
            '2':2
            '3':3
            }
        */
        let group = {}; 
        for(const item of nums)
        {
            if(group[item])
            {
                group[item]++;
            }
            else
            {
                group[item] = 1;
            }
        }
        console.log('Count ',group);
        let arr = Object.entries(group);
        console.log('arr ',arr);

        arr.sort((a,b)=>b[1]-a[1]);
        console.log('arr ',arr);
       
        arr = arr.map(item=>item[0]);
        console.log('arr ',arr);
        arr.length = k;
        console.log('arr ',arr);
    </script>    
</html>
