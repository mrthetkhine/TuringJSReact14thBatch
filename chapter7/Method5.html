<html>
    
    <script>
        let arr = [1,2,3,4,5,6];
        
        let elementToDelete =[3,5];
        
        let index = arr.indexOf(3);
        console.log('index ',index);
        
       
        console.log('arr ',arr);
        for(const item of elementToDelete)
        {
            let index = arr.indexOf(item);
            console.log('index ',index);
            arr.splice(index,1);
        }
        console.log('arr ',arr);

        let arr2 = new Array(5);

        console.log('arr2 ',arr2);

        console.log('a ',a);
        //a.copyWithin(1);
        //a.copyWithin(1,2);
        a.copyWithin(1,2,4);
        console.log('a ',a);

        index = a.lastIndexOf(1);
        console.log('index ',index);

        index = a.lastIndexOf(100);

        console.log('a.includes(3) ',a.includes(3));
