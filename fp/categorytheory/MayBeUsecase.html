
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        let count = 1;
        count ++;
        console.log('count ',count);

        let MayBe = (value)=>({
            valueOf:()=>value,
            isEmpty()
            {
                return value === null || value === undefined;
            },
            map(fn)
            {
                return this.isEmpty()?MayBe.of(null):MayBe.of(fn(value));
            },
            orElse(defaultValue)
            {
                return this.isEmpty()?MayBe.of(defaultValue):this;
            }

        })
        MayBe.of = MayBe;
        
        let employess = {
            1:{
                name: "Jhon"
            },
            2:{
                name: "Smith",
                supervisor:1    
            },
            3:{
                name: "Will",
                supervisor:2
            }
        }
        function getSupervisor(empId)
        {
            let emp = employess[empId];
            if(emp)
            {
                let supervisorId = emp.supervisor;
                if(supervisorId)
                {
                    let supervisor = employess[supervisorId];
                    if(supervisor)
                    {
                        return supervisor.name;
                    }
                }
                
            }
        }
        function getSupervisor2(empId)
        {
            return MayBe.of(empId)
                        .map(empId=>employess[empId])
                        .map(employee=>employee.supervisor)
                        .map(supervisorId=>employess[supervisorId])
                        .map(supervisor=>supervisor.name);
        }
        /*
        console.log('getSupervisor 1 ',getSupervisor(1));
        console.log('getSupervisor 2 ',getSupervisor(2));
        console.log('getSupervisor 3 ',getSupervisor(3));
        console.log('getSupervisor 4',getSupervisor(4));
        */
       console.log('getSupervisor 1 ',getSupervisor2(1).valueOf());
        console.log('getSupervisor 2 ',getSupervisor2(2).valueOf());
        console.log('getSupervisor 3 ',getSupervisor2(3).valueOf());
        console.log('getSupervisor 4',getSupervisor2(4).valueOf());
    </script>    
</html>
