
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        console.log('add(2) ',R.add(2));
        console.log('add(2,3) ',R.add(2,3));
        console.log('add(2)(3) ',R.add(2)(3));

        let obj = {
            name :'Jhon'
        };
        let newObj = R.assoc('age',20,obj);
        console.log('obj ',obj);
        console.log('newObj ',newObj);

        //newObj.address.city = 'YGN';
        let obj2 = R.assocPath(['address','city'],'YGN',newObj);
        console.log('newObj ',obj2);

        const letters = ['a', 'b', 'A', 'a', 'B', 'c'];
        const counts = R.countBy(R.toLower, letters);
        console.log('counts ',counts);
    </script>
