<html>
    <script>
        let a = 10;
        let b = a;//copy semantics

        b++;
        console.log('a ',a);
        console.log('b ',b);
        
        let obj = {
            value : 10
        };
        let obj2 = obj;//reference semantics
        obj2.value++;

        console.log('obj ',obj.value);
        console.log('obj2 ',obj2.value);

        obj2 = {
            value : 20
        }
        obj2.value++;
        console.log('obj ',obj.value);
        console.log('obj2 ',obj2.value);
    </script>
</html>
