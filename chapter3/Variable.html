<html>
    <script>
        //4, 8
        let a = 4;
        let b = 8;
        console.log('a is ',a);
        console.log('b is ',b);
        console.log('+ ', a + b);
        console.log('- ', a - b);
        console.log('* ', a * b);
        console.log('/ ', a / b);

        a += 2;
        console.log('a is ',a);

        let c = "Hello";
        let flag = true;
        
        console.log('a is ',typeof a);
        console.log('c is ',typeof c);
        console.log('flag is ',typeof flag);

        

    </script>
</html>
