
<html>
    <body>
        <button id="btnAllocate">Allocate</button>
        &nbsp;
        <button id="btnDeAllocate">DeAllocate</button>
    </body>
    <script>
        let arr,arr2;
        //let map = new Map();
        let map = new WeakMap();
        document.getElementById('btnAllocate')
                .addEventListener('click',function(){
                    console.log('allocate ');
                    arr = new Array(200_000);
                    arr2 = arr;
                    map.set(arr,10);
                });
        document.getElementById('btnDeAllocate')
                .addEventListener('click',function(){
                    console.log('deallocate ');
                    arr = null;
                    arr2 = null;
                });
    </script>    
</html>
