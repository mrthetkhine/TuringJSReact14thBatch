<html>
    
    <script>
        
        let map = new Map();
        map.set('key1','value1');
        map.set('key2','value2');
        let obj = {
            name : "Jhon",
            age : 35,
            contact:map,
            display()
            {
                console.log('Name ',this.name, " Age ",this.age);
            }
        }
        obj.display();
        let str = JSON.stringify(obj);
        console.log('str ',str);
        let obj2 = JSON.parse(str);
        console.log('obj2 ',obj2);

        console.log('obj== obj2 ',obj==obj2);

        let obj3 = Object.assign(obj,obj2);
        console.log('Obj3 ',obj3);
        
    </script>
</html>
