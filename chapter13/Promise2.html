<html>
    <script>
        
        function delayDiv(a,b)
        {
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    console.log('fire after 3 seconds');
                    if(isNaN(a) || isNaN(b))
                    {
                        return reject('A or b is NaN');
                    }
                    else
                    {
                        return resolve(a/b);
                    }
                },3000);
            })
            
            
        }
        delayDiv(10,NaN)
            .then(data=>console.log('Sucess ',data),err=>console.log('Error ',err));
    </script>
</html>
