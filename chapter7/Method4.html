<html>
    
    <script>
        let arr = [1,2];
        arr.push(3);

        arr.unshift(10);
        console.log('arr ',arr);

        console.log('shift ',arr.shift());
        console.log('arr ',arr);

        arr = [1,2,3,4,5];
        console.log('arr ',arr);

        console.log('slice ',arr.slice(1,4));//[2,3,4]
        console.log('arr ',arr);

        console.log('slice ',arr.slice(-4,-2));

        arr.splice(2,2,100,200,300);
        console.log('arr ',arr);
    </script>
</html>
