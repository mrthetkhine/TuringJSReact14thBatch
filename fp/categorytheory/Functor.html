
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        let count = 1;
        count ++;
        console.log('count ',count);

        let Container = (value) => ({
            valueOf:()=>value,
            map:(fn)=>Container(fn(value))  
        });
        Container.of = Container;
        const inc=(x)=>x+1;
        const double=(x)=>x*2;
        let c1 = Container.of(1);
        console.log('c1 ',c1.valueOf());

        let c2 = c1.map(R.pipe(inc,double));
                   
        console.log('c1 ',c1.valueOf());
        console.log('c2 ',c2.valueOf());
       
    </script>    
</html>
