<html>
    
    <script>
        let arr = new Array(5);
        console.log('arr ',arr);
        
        let arr2 = new Array(10,20);
        console.log('arr2 ',arr2);

        let arr3 = Array.of(10,30,40);
        console.log('arr3 ',arr3);

        let arr4 = Array.from(arr3);
        console.log('arr4 ',arr4);

        
    </script>
</html>
