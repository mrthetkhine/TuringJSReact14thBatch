<html>
    
    <script>
        
        function hello() {
            console.log('Hello');
            console.log('World');
        }
        
        hello();
        console.log('Other');

        hello();
        console.log('Another');

        hello();

        let fun = function() {
            console.log('Function');
        }
        fun();

        let func2 = ()=>console.log('Arrow Function');
        func2();
    </script>
</html>
