<html>
    
    <script>
        
        function getSomething()
        {
            console.log('getSomething');
            return 100;
        }
        let result = getSomething();
        console.log(result);

        function add(a,b)//parameter//
        {
            return a+b;
        }
        result = add(10,20);//arguments a=10,b=20
        console.log('Result ',result);

        result = add(20,40);
        console.log('Result ',result);

        function inc(a)
        {
            a++;
        }
        let data = 10;
        inc(data);
        console.log('data ',data);//a=data

        function inc2(obj)
        {
            obj.value ++;
        }
        let obj2 = {
            value: 100
        };
        inc2(obj2);
        console.log('obj2.value ',obj2.value);//obj=obj2

        function inc3(obj)
        {
            obj = {
                value: 200
            }
        }
        inc3(obj2);
        console.log('obj2.value ',obj2.value);
    </script>
</html>
