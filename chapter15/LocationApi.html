<html>
    <style>
       .box
       {
        height:7000px;
       }
    </style>
    <body>
        <button type="button" id="btnGo">Go</button>
        <a href="#end">Go end</a>
        
        <div id="container" class="box" color="red">
            Container
            <div>
                Child of container
            </div>
        </div>
        <h1 id="end">End</h1>
        <button type="button" id="btnBack">Back</button>
    </body>
    <script>
        
        document.getElementById('btnGo')
                .addEventListener('click',()=>{
                    //window.location = "https://www.google.com"
                    window.location.href = "#end"
                });
        document.getElementById('btnBack')
                .addEventListener('click',()=>{
                    window.history.back();
                });
    </script>
</html>
