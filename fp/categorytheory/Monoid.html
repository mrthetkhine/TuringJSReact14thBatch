
<html>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/ramda/0.30.1/ramda.js"></script>
    <script>
        let Plus = {
            identity: ()=>0,
            binaryOp:(a,b)=>a+b
        }
        let Mult = {
            identity: ()=>1,
            binaryOp:(a,b)=>a*b
        }
        let Min = {
            identity: ()=>Infinity,
            binaryOp:(a,b)=>Math.min(a,b)
        }
        function fold(monoid,arr)
        {
            return arr.reduce(monoid.binaryOp,monoid.identity());
        }
        let arr = [1,2,3,-1,2,4];
        console.log('Min ',fold(Min,arr));
        console.log('Total ',fold(Plus,arr));
    </script>    
</html>
